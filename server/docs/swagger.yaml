host: localhost:2333
info:
  contact:
    email: huahua1319873800@outlook.com
    name: API Support
    url: https://github.com/anticoi/EscudoWAF
  description: EscudoWAF - API del sistema de gestión de firewall de aplicaciones
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://github.com/anticoi/EscudoWAF
  title: EscudoWAF-WAF API
  version: "1.0"
paths:
  /api/runner/control:
    post:
      consumes:
      - application/json
      description: Ejecutar operación de inicio, parada, reinicio, parada forzada o recarga en caliente
      parameters:
      - description: Petición de control del runner
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RunnerControlRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operación exitosa
          schema:
            allOf:
            - $ref: '#/definitions/model.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RunnerControlResponse'
              type: object
        "400":
          description: Parámetros de solicitud incorrectos
          schema:
            $ref: '#/definitions/model.ErrResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/model.ErrResponseDontShowError'
      security:
      - BearerAuth: []
      summary: Controlar el runner en segundo plano
      tags:
      - Gestión del runner
  /api/runner/status:
    get:
      description: Obtener el estado de ejecución del runner del WAF
      produces:
      - application/json
      responses:
        "200":
          description: Estado del runner obtenido con éxito
          schema:
            allOf:
            - $ref: '#/definitions/model.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RunnerStatusResponse'
              type: object
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/model.ErrResponseDontShowError'
      security:
      - BearerAuth: []
      summary: Obtener el estado del runner en segundo plano
      tags:
      - Gestión del runner
  /api/v1/blocked-ips:
    get:
      description: Obtener la lista de IPs bloqueadas, con paginación, filtrado y ordenación
      parameters:
      - default: 1
        description: Número de página, comenzando en 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Cantidad por página, máximo 100
        in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: Filtrado por dirección IP, soporta coincidencia difusa
        example: 192.168.1.1
        in: query
        name: ip
        type: string
      - description: Filtro por motivo de bloqueo
        example: high_frequency_attack
        in: query
        name: reason
        type: string
      - default: all
        description: Filtro de estado: active - activo, expired - expirado, all - todos
        enum:
        - active
        - expired
