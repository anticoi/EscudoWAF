services:
  # Servicio MongoDB
  mongodb:
    image: mongo:6.0
    container_name: waf-demo-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example # reemplazar por su contraseña real
      # Opcional: nombre inicial de la base de datos
      # MONGO_INITDB_DATABASE: waf_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb # añadir volumen de datos de configuración
    ports:
      - "27017:27017"
    networks:
      - waf-network
    # Opcional: añadir argumentos de línea de comandos
    # command: --wiredTigerCacheSizeGB 1.5

  # Servicio EscudoWAF (nombres en minúsculas)
  escudo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escudo-waf # nombre de contenedor en minúsculas
    restart: always
    depends_on:
      - mongodb
    environment:
      DB_URI: mongodb://root:example@mongodb:27017 # reemplazar por su contraseña real
      JWT_SECRET: ffffffffffffffffffffffffffffff
      IS_PRODUCTION: "false"
      VITE_API_BASE_URL: http://localhost:2333/api/v1
    ports:
      - "2333:2333"
      - "8080:8080"
      - "9443:9443"
      - "443:443"
      - "80:80"
      - "8404:8404"
    volumes:
      - escudo_data:/app/data
    networks:
      - waf-network

# Definición de volúmenes persistentes
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  escudo_data:
    driver: local

# Definición de redes
networks:
  waf-network:
    driver: bridge
