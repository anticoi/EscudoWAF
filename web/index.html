<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" type="image/svg+xml" href="/logo.svg" />

        <!-- Definición del color del tema -->
        <meta name="theme-color" content="#8a64d0" />

        <!-- Metaetiquetas SEO -->
        <meta
            name="description"
            content="EscudoWAF - Sistema de gestión de firewall de aplicaciones web"
        />
        <meta
            name="keywords"
            content="WAF, web security, firewall, protection"
        />

        <!-- Información para compartir en redes sociales -->
        <meta property="og:title" content="EscudoWAF" />
        <meta property="og:description" content="Sistema de gestión de firewall de aplicaciones web" />
        <meta property="og:image" content="/og-image.png" />

        <!-- Configuración de seguridad -->
        <meta http-equiv="X-Content-Type-Options" content="nosniff" />

        <!-- Precargar recursos críticos -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Estilos de carga de página para evitar pantalla blanca inicial -->
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans",
                    "Helvetica Neue", sans-serif;
            }

            .app-loading {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            }

            /* Usar fondo degradado púrpura */
            .app-loading-background {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    135deg,
                    rgba(147, 112, 219, 0.95) 0%,
                    rgba(138, 100, 208, 0.9) 50%,
                    rgba(123, 79, 214, 0.95) 100%
                );
                background-size: 200% 200%;
            }

            .app-loading-blur-elements {
                position: absolute;
                inset: 0;
                overflow: hidden;
            }

            .app-loading-blur-1 {
                position: absolute;
                width: 80%;
                height: 80%;
                top: 10%;
                left: 10%;
                background-color: rgba(255, 255, 255, 0.1);
                /* white/10 */
                border-radius: 9999px;
                filter: blur(24px);
                animation: preload-float 8s ease-in-out infinite;
            }

            .app-loading-blur-2 {
                position: absolute;
                width: 40%;
                height: 40%;
                top: 5%;
                right: 15%;
                background-color: rgba(233, 213, 255, 0.2);
                /* purple-200/20 */
                border-radius: 9999px;
                filter: blur(24px);
                animation: preload-float-reverse 9s ease-in-out infinite;
            }

            .app-loading-blur-3 {
                position: absolute;
                width: 50%;
                height: 50%;
                bottom: 5%;
                left: 15%;
                background-color: rgba(243, 232, 255, 0.2);
                /* purple-100/20 */
                border-radius: 9999px;
                filter: blur(24px);
                animation: preload-pulse-glow 4s ease-in-out infinite;
            }

            /* Contenedor de la barra de progreso */
            .app-loading-content {
                position: relative;
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 32px;
                /* Changed from 24px to 32px (space-y-8) */
            }

            .app-loading-text {
                color: white;
                font-size: 24px;
                font-weight: 500;
                animation: preload-fade-in 0.5s ease-out;
            }

            .app-loading-progress-container {
                width: 256px;
                height: 8px;
                background-color: rgba(255, 255, 255, 0.2);
                border-radius: 9999px;
                overflow: hidden;
            }

            .app-loading-progress-bar {
                height: 100%;
                width: 0%;
                border-radius: 9999px;
                background: linear-gradient(90deg, #e0c3fc 0%, #8ec5fc 100%);
                box-shadow: 0 0 10px rgba(224, 195, 252, 0.7);
                transition: width 0.3s ease;
            }

            .app-loading-percentage {
                color: rgba(255, 255, 255, 0.8);
                font-size: 14px;
                animation: preload-pulse 2s infinite;
            }

            /* Definir fotogramas clave de la animación */
            @keyframes preload-float {
                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(-20px) scale(1.05);
                }
            }

            @keyframes preload-float-reverse {
                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(20px) scale(1.05);
                }
            }

            @keyframes preload-pulse-glow {
                0%,
                100% {
                    opacity: 0.6;
                    transform: scale(1);
                }

                50% {
                    opacity: 0.8;
                    transform: scale(1.1);
                }
            }

            @keyframes preload-pulse {
                0%,
                100% {
                    opacity: 0.5;
                }

                50% {
                    opacity: 1;
                }
            }

            @keyframes preload-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>

        <title>EscudoWAF</title>
    </head>

    <body>
        <div id="root">
            <!-- Indicador de carga mostrado antes de cargar la app -->
            <div class="app-loading">
                <div class="app-loading-background"></div>
                <div class="app-loading-blur-elements">
                    <div class="app-loading-blur-1"></div>
                    <div class="app-loading-blur-2"></div>
                    <div class="app-loading-blur-3"></div>
                </div>
                <div class="app-loading-content">
                    <div class="app-loading-text">Loading...</div>
                    <div class="app-loading-progress-container">
                        <div
                            class="app-loading-progress-bar"
                            id="progressBar"
                        ></div>
                    </div>
                    <div class="app-loading-percentage" id="progressText">
                        0% Complete
                    </div>
                </div>
            </div>
        </div>
        <script>
            // Match the React component's progress calculation logic exactly
            (function () {
                const progressBar = document.getElementById("progressBar");
                const progressText = document.getElementById("progressText");
                let progress = 0;

                const timer = setInterval(() => {
                    // Slow down as it approaches 100%
                    // Usar Math.floor para garantizar un resultado entero
                    const increment = Math.floor(
                        Math.max(1, 10 * (1 - progress / 100))
                    );
                    progress = Math.min(99, progress + increment);
                    // Asegurar que el resultado final también sea entero
                    progress = Math.floor(progress);

                    // Update the DOM
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `${progress}% Complete`;

                    if (progress >= 99) {
                        clearInterval(timer);
                    }
                }, 200);
            })();
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
